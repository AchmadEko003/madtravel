<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon — MadTravel</title>

  <!-- Google Fonts via link (Bebas error @import dan render lebih cepat) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-sand: #FFFDF8;
      --bg-card: #FFFFFF;
      --bg-ocean-tint: #E6F8F6;
      --text-navy: #0F2942;
      --text-slate: #4A6378;
      --text-muted: #7C93A6;
      --coral: #FF5A36;
      --sunny: #FFB800;
      --border-bold: #0F2942;
      --shadow-pop: 4px 4px 0px #0F2942;
      --shadow-pop-sm: 2px 2px 0px #0F2942;
      --radius-md: 16px;
      --radius-xl: 32px;
      --radius-pill: 9999px;
      --font-display: 'Fredoka', 'Plus Jakarta Sans', sans-serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-sand);
      color: var(--text-navy);
      line-height: 1.6;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 10% 15%, rgba(0, 180, 162, 0.08) 0%, transparent 35%),
        radial-gradient(circle at 90% 10%, rgba(255, 184, 0, 0.1) 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(255, 90, 54, 0.06) 0%, transparent 40%);
    }

    .coming-soon-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }

    /* Brand Logo */
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-size: 1.55rem;
      font-weight: 700;
      color: var(--text-navy);
      margin-bottom: 24px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      background: var(--coral);
      border: 2px solid var(--border-bold);
      box-shadow: var(--shadow-pop-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      transform: rotate(-4deg);
      transition: var(--transition);
    }

    .brand-logo:hover .brand-icon {
      transform: rotate(6deg) scale(1.06);
    }

    /* Card Neo-Brutalism */
    .coming-card {
      background: var(--bg-card);
      border: 3px solid var(--border-bold);
      border-radius: var(--radius-xl);
      box-shadow: 8px 8px 0px var(--border-bold);
      padding: 48px 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      position: relative;
      transition: var(--transition);
    }

    .coming-card:hover {
      transform: translateY(-4px);
      box-shadow: 10px 10px 0px var(--border-bold);
    }

    .floating-deco {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 68px;
      height: 68px;
      border-radius: 22px;
      background: var(--bg-ocean-tint);
      border: 2.5px solid var(--border-bold);
      box-shadow: var(--shadow-pop);
      font-size: 2rem;
      margin-bottom: 20px;
      transform: rotate(-4deg);
      transition: var(--transition);
    }

    .coming-card:hover .floating-deco {
      transform: rotate(6deg) scale(1.06);
      background: var(--sunny);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: var(--radius-pill);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      border: 2px solid var(--border-bold);
      box-shadow: var(--shadow-pop-sm);
      background: var(--sunny);
      color: var(--text-navy);
      margin-bottom: 16px;
    }

    .title-display {
      font-family: var(--font-display);
      font-size: clamp(2rem, 4vw, 2.75rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: var(--text-navy);
      margin-bottom: 12px;
    }

    .highlight-coral {
      color: var(--coral);
    }

    @media (max-width: 540px) {
      .coming-card {
        padding: 36px 24px;
      }
    }
  </style>
</head>
<body>

  <main class="coming-soon-page">
    <!-- Brand Identity -->
    <div class="brand-logo">
      <div class="brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>
        </svg>
      </div>
      <span>MadTravel</span>
    </div>

    <!-- Simple Neo-Brutalist Coming Soon Card -->
    <section class="coming-card">
      <div class="floating-deco">🏝️</div>

      <div>
        <span class="badge">
          ✨ COMING SOON
        </span>
      </div>

      <h1 class="title-display">
        Segera <span class="highlight-coral">Hadir!</span>
      </h1>

      <p style="color: var(--text-slate); font-size: 1rem; max-width: 400px; margin: 0 auto;">
        Kami sedang menyiapkan sesuatu yang seru untuk perjalananmu berikutnya. Nantikan kehadirannya segera!
      </p>
    </section>

    <p style="margin-top: 24px; font-size: 0.82rem; font-weight: 700; color: var(--text-muted);">
      © 2026 MadTravel
    </p>
  </main>

</body>
</html>
